<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>일정 관리</title>

<style>
* {
    box-sizing: border-box;
}

.container {
    display: flex;
    height: 100vh;
}

.left-section {
    flex: 1;
    border-right: 2px solid #ccc;
}

.right-section {
    flex: 1;
}

.header {
    border: 2px solid #333;
    border-radius: 20px;
    padding: 10px;
    text-align: center;
    margin: 10px;
}

.todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px;
}

.todo-item input[type="text"] {
    flex: 1;
    border: 1px solid #ccc;
    padding: 5px;
}

/* 캘린더 */
table {
    width: 95%;
    border-collapse: collapse;
    margin: 10px;
}

th, td {
    border: 1px solid #ccc;
    text-align: center;
    padding: 6px;
}

/* 입력 영역 */
.input-area {
    margin: 10px;
    padding: 10px;
    border: 1px solid #000;
}

.dday-list {
    margin: 10px;
    padding: 10px;
    border: 1px solid #000;
}
</style>

</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left-section">

        <div class="header">
            <h2>나의 일정</h2>
        </div>

        <!-- 캘린더 -->
        <div style="margin:10px; border:1px solid #ddd; padding:10px;">
            <h3 id="monthTitle"></h3>
            <table id="calendar"></table>
        </div>

        <!-- 일정 입력 -->
        <div class="input-area">
            <input type="text" id="eventName" placeholder="일정 이름">
            <input type="date" id="eventDate">
            <button onclick="addEvent()">추가</button>
        </div>

        <!-- D-day 출력 -->
        <div class="dday-list" id="eventList">
            일정 없음
        </div>

    </div>

    <!-- RIGHT -->
    <div class="right-section">

        <div class="header">
            <h2>To-do list</h2>
        </div>

        <div class="todo-item">
            <input type="checkbox">
            <input type="text" placeholder="할 일 입력">
        </div>

        <div class="todo-item">
            <input type="checkbox">
            <input type="text" placeholder="할 일 입력">
        </div>

        <div class="todo-item">
            <input type="checkbox">
            <input type="text" placeholder="할 일 입력">
        </div>

    </div>

</div>

<script>
// =====================
// 캘린더
// =====================
const today = new Date();
const year = today.getFullYear();
const month = today.getMonth();

document.getElementById("monthTitle").innerText =
year + "년 " + (month + 1) + "월";

const firstDay = new Date(year, month, 1).getDay();
const lastDate = new Date(year, month + 1, 0).getDate();

let html = "<tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr><tr>";

let count = 0;

for (let i = 0; i < firstDay; i++) {
    html += "<td></td>";
    count++;
}

for (let d = 1; d <= lastDate; d++) {
    html += "<td>" + d + "</td>";
    count++;

    if (count % 7 === 0) {
        html += "</tr><tr>";
    }
}

html += "</tr>";

document.getElementById("calendar").innerHTML = html;


// =====================
// 일정 추가 + D-day
// =====================
let events = [];

function addEvent() {
    const name = document.getElementById("eventName").value;
    const date = document.getElementById("eventDate").value;

    if (!name || !date) return;

    events.push({ name, date });

    renderEvents();
}

function renderEvents() {
    const list = document.getElementById("eventList");

    if (events.length === 0) {
        list.innerHTML = "일정 없음";
        return;
    }

    list.innerHTML = "";

    const today = new Date();

    events.forEach(e => {
        const target = new Date(e.date);
        const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));

        list.innerHTML +=
            e.name + " : D-" + diff + " (" + e.date + ")<br>";
    });
}
</script>

</body>
</html>
