<script>
// 캘린더
const today = new Date();
const year = today.getFullYear();
const month = today.getMonth();

document.getElementById("monthTitle").innerText =
    year + "년 " + (month + 1) + "월";

const firstDay = new Date(year, month, 1).getDay();
const lastDate = new Date(year, month + 1, 0).getDate();

let table = "<tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr><tr>";

let day = 0;

for (let i = 0; i < firstDay; i++) {
    table += "<td></td>";
    day++;
}

for (let d = 1; d <= lastDate; d++) {
    table += "<td>" + d + "</td>";
    day++;

    if (day % 7 === 0) {
        table += "</tr><tr>";
    }
}

table += "</tr>";

document.getElementById("calendarTable").innerHTML = table;


// D-day
const targetDate = new Date(2026, 5, 30);
const diff = targetDate - today;
const dday = Math.ceil(diff / (1000 * 60 * 60 * 24));

document.getElementById("ddayBox").innerText =
    "⏰ D-day : 시험일까지 " + dday + "일 남음";
</script>
