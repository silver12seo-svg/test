<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>일정 관리</title>

<style>
.container {
    display: flex;
    height: 100vh;
}

.left-section {
    flex: 1;
    border-right: 2px solid #ccc;
}

.right-section {
    flex: 1;
}

.header {
    border: 2px solid #333;
    border-radius: 20px;
    padding: 10px;
    text-align: center;
    margin: 10px;
}

.todo-box {
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 15px;
    margin: 10px;
}

.todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.todo-item input[type="text"] {
    flex: 1;
}
</style>

</head>

<body>

<div class="container">

    <div class="left-section">
        <div class="header">
            <h2>나의 일정</h2>
        </div>
    </div>

    <div class="right-section">

        <div class="header">
            <h2>To-do list</h2>
        </div>

        <div class="todo-box">

            <div class="todo-item">
                <input type="checkbox">
                <input type="text" placeholder="할 일 입력">
            </div>

            <div class="todo-item">
                <input type="checkbox">
                <input type="text" placeholder="할 일 입력">
            </div>

            <div class="todo-item">
                <input type="checkbox">
                <input type="text" placeholder="할 일 입력">
            </div>

        </div>

    </div>

</div>

</body>
</html>
