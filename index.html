<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>일정 관리</title>

<style>
.container {
    display: flex;
    height: 100vh;
}

.left-section {
    flex: 1;
    border-right: 2px solid #ccc;
}

.right-section {
    flex: 1;
}

.header {
    border: 2px solid #333;
    border-radius: 20px;
    padding: 10px;
    text-align: center;
    margin: 10px;
}

.todo-list {
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 10px;
    margin: 10px;
}

.todo-item {
    border: 1px solid #ddd;
    border-radius: 8px;
    margin: 5px 0;
    padding: 5px;
}

.calendar,
.d-day-list,
.progress-area,
.theme-area {
    border: 1px solid #ddd;
    border-radius: 10px;
    margin: 10px;
    padding: 10px;
}
</style>

</head>

<body>

<div class="container">

    <div class="left-section">

        <div class="header">
            <h2>나의 일정</h2>
        </div>

        <div class="calendar"></div>
        <div class="d-day-list"></div>

    </div>

    <div class="right-section">

        <div class="header">
            <h2>To-do list</h2>
        </div>

        <div class="progress-area"></div>

        <div class="todo-list">

            <div class="todo-item"></div>
            <div class="todo-item"></div>
            <div class="todo-item"></div>

        </div>

        <div class="theme-area"></div>

    </div>

</div>

</body>
</html>
