<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>일정 관리</title>

<style>
.container {
    display: flex;
    height: 100vh;
}

.left-section {
    flex: 1;
    border-right: 2px solid #ccc;
}

.right-section {
    flex: 1;
}

.header {
    border: 2px solid #333;
    border-radius: 20px;
    padding: 10px;
    text-align: center;
    margin: 10px;
}

.todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px;
}

.todo-item input[type="text"] {
    flex: 1;
    border: 1px solid #ccc;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    text-align: center;
    padding: 5px;
}

.dday {
    margin: 10px;
    padding: 10px;
    border: 1px solid #000;
}
</style>

</head>

<body>

<div class="container">

    <div class="left-section">

        <div class="header">
            <h2>나의 일정</h2>
        </div>

        <!-- 캘린더 -->
        <div style="margin:10px; border:1px solid #ddd; padding:10px;">
            <h3 id="monthTitle"></h3>
            <table id="calendar"></table>
        </div>

        <!-- D-day 입력 -->
        <div class="dday">
            <p>시험일 선택:</p>
            <input type="date" id="examDate">
            <button onclick="calcDDay()">계산</button>
            <p id="ddayResult">D-day : -</p>
        </div>

    </div>

    <div class="right-section">

        <div class="header">
            <h2>To-do list</h2>
        </div>

        <div class="todo-item">
            <input type="checkbox">
            <input type="text" placeholder="할 일 입력">
        </div>

        <div class="todo-item">
            <input type="checkbox">
            <input type="text" placeholder="할 일 입력">
        </div>

        <div class="todo-item">
            <input type="checkbox">
            <input type="text" placeholder="할 일 입력">
        </div>

    </div>

</div>

<script>
// 캘린더
const today = new Date();
const year = today.getFullYear();
const month = today.getMonth();

document.getElementById("monthTitle").innerText =
year + "년 " + (month + 1) + "월";

const firstDay = new Date(year, month, 1).getDay();
const lastDate = new Date(year, month + 1, 0).getDate();

let html = "<tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr><tr>";

let count = 0;

for (let i = 0; i < firstDay; i++) {
    html += "<td></td>";
    count++;
}

for (let d = 1; d <= lastDate; d++) {
    html += "<td>" + d + "</td>";
    count++;

    if (count % 7 === 0) {
        html += "</tr><tr>";
    }
}

html += "</tr>";

document.getElementById("calendar").innerHTML = html;


// D-day 계산 함수
function calcDDay() {
    const input = document.getElementById("examDate").value;

    if (!input) {
        document.getElementById("ddayResult").innerText = "날짜를 선택하세요";
        return;
    }

    const today = new Date();
    const target = new Date(input);

    const diff = target - today;
    const dday = Math.ceil(diff / (1000 * 60 * 60 * 24));

    document.getElementById("ddayResult").innerText =
        "D-day : " + dday + "일 남음";
}
</script>

</body>
</html>
