<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>D-day 일정 관리</title>

<style>
.container {
    display: flex;
    height: 100vh;
    font-family: Arial;
}

.left {
    flex: 1;
    padding: 20px;
    border-right: 2px solid #ccc;
}

.right {
    flex: 1;
    padding: 20px;
}

.header {
    border: 2px solid #333;
    border-radius: 20px;
    padding: 10px;
    text-align: center;
    margin-bottom: 20px;
}

.input-box {
    margin-bottom: 20px;
}

.input-box input {
    padding: 5px;
    margin: 5px;
}

.list {
    border: 1px solid #ccc;
    padding: 10px;
}

.item {
    padding: 5px;
    border-bottom: 1px solid #eee;
}
</style>

</head>

<body>

<div class="container">

    <div class="left">

        <div class="header">
            <h2>나의 일정</h2>
        </div>

        <div class="input-box">
            <input type="text" id="title" placeholder="일정 이름">
            <input type="date" id="date">
            <button onclick="add()">추가</button>
        </div>

        <div class="list" id="list">
            일정 없음
        </div>

    </div>

    <div class="right">
        <div class="header">
            <h2>To-do list</h2>
        </div>
        <p>여기는 나중에 추가</p>
    </div>

</div>

<script>

let events = [];

function add() {
    const title = document.getElementById("title").value;
    const date = document.getElementById("date").value;

    if (!title || !date) return;

    events.push({ title, date });

    render();
}

function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    const today = new Date();

    events.forEach(e => {
        const target = new Date(e.date);
        const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));

        list.innerHTML += `
            <div class="item">
                ${e.title} → D-${diff} (${e.date})
            </div>
        `;
    });
}

</script>

</body>
</html>
