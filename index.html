<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>일정 관리</title>

<style>
.container {
    display: flex;
    height: 100vh;
}

.left-section {
    flex: 1;
    border-right: 2px solid #ccc;
}

.right-section {
    flex: 1;
}

.header {
    border: 2px solid #333;
    border-radius: 20px;
    padding: 10px;
    text-align: center;
    margin: 10px;
}

.todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px;
}

.todo-item input[type="text"] {
    flex: 1;
    border: 1px solid #ccc;
}

/* 캘린더 */
table {
    width: 90%;
    margin: 10px;
    border-collapse: collapse;
}

td, th {
    border: 1px solid #ccc;
    text-align: center;
    padding: 5px;
}

/* D-day */
.dday {
    margin: 10px;
    padding: 10px;
    border: 1px solid #ccc;
}
</style>

</head>

<body>

<div class="container">

    <div class="left-section">

        <div class="header">
            <h2>나의 일정</h2>
        </div>

        <!-- 캘린더 -->
        <table>
            <tr>
                <th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th>
            </tr>
            <tr>
                <td></td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td>
            </tr>
            <tr>
                <td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td>
            </tr>
        </table>

        <!-- D-day -->
        <div class="dday">
            ⏰ D-day : 시험일까지 13일 남음
        </div>

    </div>

    <div class="right-section">

        <div class="header">
            <h2>To-do list</h2>
        </div>

        <div class="todo-item">
            <input type="checkbox">
            <input type="text" placeholder="할 일 입력">
        </div>

        <div class="todo-item">
            <input type="checkbox">
            <input type="text" placeholder="할 일 입력">
        </div>

        <div class="todo-item">
            <input type="checkbox">
            <input type="text" placeholder="할 일 입력">
        </div>

    </div>

</div>

</body>
</html>
