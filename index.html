<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>D-day 일정 관리</title>

<style>
.container {
    display: flex;
    height: 100vh;
    font-family: Arial;
}

.left {
    flex: 1;
    padding: 20px;
    border-right: 2px solid #ccc;
}

.right {
    flex: 1;
    padding: 20px;
}

.header {
    border: 2px solid #333;
    border-radius: 20px;
    padding: 10px;
    text-align: center;
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
}

th, td {
    border: 1px solid #ccc;
    text-align: center;
    padding: 5px;
}

.input-box {
    margin-bottom: 20px;
}

.input-box input {
    padding: 5px;
    margin: 5px;
}

.list {
    border: 1px solid #ccc;
    padding: 10px;
}

.item {
    padding: 5px;
    border-bottom: 1px solid #eee;
}

.todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px;
}

.todo-item input[type="text"] {
    flex: 1;
    border: 1px solid #ccc;
    padding: 5px;
}
</style>

</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">

        <div class="header">
            <h2>나의 일정</h2>
        </div>

        <h3 id="monthTitle"></h3>
        <table id="calendar"></table>

        <div class="list" id="list">일정 없음</div>

        <div class="input-box">
            <input type="text" id="title" placeholder="일정 이름">
            <input type="date" id="date">
            <button onclick="add()">추가</button>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="header">
            <h2>To-do list</h2>
        </div>

        <div class="todo-item">
            <input type="checkbox">
            <input type="text" placeholder="할 일 입력">
        </div>

        <div class="todo-item">
            <input type="checkbox">
            <input type="text" placeholder="할 일 입력">
        </div>

        <div class="todo-item">
            <input type="checkbox">
            <input type="text" placeholder="할 일 입력">
        </div>

    </div>

</div>

<script>

// 캘린더
const today = new Date();
const year = today.getFullYear();
const month = today.getMonth();

document.getElementById("monthTitle").innerText =
year + "년 " + (month + 1) + "월";

const firstDay = new Date(year, month, 1).getDay();
const lastDate = new Date(year, month + 1, 0).getDate();

let html = "<tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr><tr>";

let count = 0;

for (let i = 0; i < firstDay; i++) {
    html += "<td></td>";
    count++;
}

for (let d = 1; d <= lastDate; d++) {
    html += "<td>" + d + "</td>";
    count++;

    if (count % 7 === 0) {
        html += "</tr><tr>";
    }
}

html += "</tr>";

document.getElementById("calendar").innerHTML = html;


// D-day
let events = [];

function add() {
    const title = document.getElementById("title").value;
    const date = document.getElementById("date").value;

    if (!title || !date) return;

    events.push({ title, date });
    render();
}

function formatDate(dateStr) {
    const d = new Date(dateStr);
    return String(d.getMonth() + 1).padStart(2,'0') + ". " +
           String(d.getDate()).padStart(2,'0') + ".";
}

function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    const now = new Date();
    now.setHours(0,0,0,0);

    if (events.length === 0) {
        list.innerHTML = "일정 없음";
        return;
    }

    events.forEach(e => {
        const target = new Date(e.date);
        target.setHours(0,0,0,0);

        const diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));

        let dday = diff > 0 ? "D-" + diff :
                   diff < 0 ? "D+" + Math.abs(diff) :
                   "D-Day";

        list.innerHTML += `
            <div class="item">
                ${e.title} ${dday} (${formatDate(e.date)})
            </div>
        `;
    });
}

</script>

</body>
</html>
