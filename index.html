<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>일정 관리</title>
</head>

<body>

    <div class="container">

        <div class="left-section">

            <div class="header">
                <h2>나의 일정</h2>
                <button>접기</button>
            </div>

            <div class="calendar"></div>

            <div class="d-day-list">
                <p>05.16 시험일 D-13</p>
                <p>05.18 생일 D-15</p>
            </div>

        </div>

        <div class="right-section">

            <div class="header">
                <h2>to-do list</h2>
                <button>접기</button>
            </div>

            <div class="progress-area">
                <div class="progress-bar"></div>
                <span>100%</span>
            </div>

            <div class="todo-list">

                <div class="todo-item">
                    <input type="text">
                    <input type="checkbox">
                </div>

                <div class="todo-item">
                    <input type="text">
                    <input type="checkbox">
                </div>

                <div class="todo-item">
                    <input type="text">
                    <input type="checkbox">
                </div>

            </div>

            <div class="theme-area">
                <button class="green"></button>
                <button class="blue"></button>
                <button class="red"></button>
            </div>

        </div>

    </div>

</body>
</html>
