<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>일정 관리</title>

<style>
body {
    margin: 0;
    font-family: Arial;
}

.container {
    display: flex;
    height: 100vh;
}

.left-section {
    flex: 1;
    border-right: 2px solid #ccc;
    padding: 20px;
}

.right-section {
    flex: 1;
    padding: 20px;
}

.header-box {
    border: 2px solid #333;
    border-radius: 20px;
    padding: 10px;
    text-align: center;
    margin-bottom: 15px;
}

.todo-box {
    border: 1px solid #ccc;
    padding: 15px;
    border-radius: 10px;
}

.todo-item {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}

input[type="text"] {
    flex: 1;
    padding: 5px;
}
</style>

</head>

<body>

<div class="container">

    <div class="left-section">

        <div class="header-box">
            나의 일정
        </div>

        <div style="border:1px solid #ddd; height:200px; margin-bottom:20px;"></div>

        <div style="border:1px solid #ddd; padding:10px;">
            D-day 목록
        </div>

    </div>

    <div class="right-section">

        <div class="header-box">
            To-do list
        </div>

        <div class="todo-box">

            <div class="todo-item">
                <input type="checkbox">
                <input type="text" placeholder="할 일 입력">
            </div>

            <div class="todo-item">
                <input type="checkbox">
                <input type="text" placeholder="할 일 입력">
            </div>

            <div class="todo-item">
                <input type="checkbox">
                <input type="text" placeholder="할 일 입력">
            </div>

        </div>

    </div>

</div>

</body>
</html>
